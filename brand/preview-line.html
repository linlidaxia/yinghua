<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; background: #f4f4f6; font-family: "Microsoft YaHei", system-ui, sans-serif; }
  .row { display: flex; gap: 20px; padding: 24px; }
  .card { flex: 1; background: #fff; border-radius: 20px; padding: 20px; display: flex; flex-direction: column; align-items: center; gap: 12px; }
  .label { font-size: 13px; opacity: .6; }
  img { width: 300px; height: 300px; }
  .small { width: 96px; height: 96px; }
  .dark { background: #161117; }
  .dark .label { color: #fff; }
</style>
</head>
<body>
<div class="row">
  <div class="card"><div class="label">方案 A（填充）</div><img src="logo-a.svg"><img class="small" src="logo-a.svg"></div>
  <div class="card"><div class="label">方案 A-line（线描莲花）</div><img src="logo-line.svg"><img class="small" src="logo-line.svg"></div>
  <div class="card dark"><div class="label">A-line · 深色</div><img src="logo-line.svg"></div>
</div>
</body>
</html>
