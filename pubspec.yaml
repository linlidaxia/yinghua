name: yinghua
description: "莺花 · 支持 Navidrome / Subsonic 的本地与串流音乐播放器"
publish_to: 'none'
version: 1.0.25+26

environment:
  sdk: ^3.14.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # 播放与后台 / 锁屏控制
  just_audio: ^0.10.6
  audio_service: ^0.18.19
  audio_session: ^0.2.4

  # 状态管理与本地存储
  provider: ^6.1.5
  shared_preferences: ^2.5.6
  path_provider: ^2.1.6
  charset: ^2.0.1
  xml: ^7.1.0

  # 网络
  dio: ^5.11.1
  crypto: ^3.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/audio/demo_loop.wav
    - assets/brand/logo.png
